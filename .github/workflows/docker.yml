
 name: Build Push and Deploy

on:
  push:
    branches:
      - main

jobs:

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build -t ayusnath/ai-backend:latest ./ai-interview-Backend

      - name: Push Backend Image
        run: docker push ayusnath/ai-backend:latest

      - name: Build Frontend Image
        run: |
          docker build -t ayusnath/ai-frontend:latest ./ai-interview-Frontend

      - name: Push Frontend Image
        run: docker push ayusnath/ai-frontend:latest


  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/ai-interview

            docker-compose pull

            docker-compose down

            docker-compose up -d

            docker image prune -f